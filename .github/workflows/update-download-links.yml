name: Update download links

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-download-links
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const repo = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...repo, per_page: 100
            });
            const release = releases.filter(r => !r.draft && r.published_at)
              .sort((a, b) => Date.parse(b.published_at) - Date.parse(a.published_at) || b.id - a.id)[0];
            if (!release) throw new Error('No published release found.');
            function asset(pattern) {
              const matches = release.assets.filter(a => a.state === 'uploaded' && pattern.test(a.name));
              if (matches.length !== 1) throw new Error(`Expected one matching asset in ${release.tag_name}: ${pattern}`);
              return matches[0].browser_download_url;
            }
            const links = new Map([
              ['Download the APK', asset(/\.apk$/i)],
              ['Release notes', release.html_url],
              ['Download the computer companion', asset(/^Sunlith-companion-.*\.zip$/i)]
            ]);
            const { data: metadata } = await github.rest.repos.get(repo);
            const branch = metadata.default_branch;
            const { data: file } = await github.rest.repos.getContent({
              ...repo, path: 'README.md', ref: branch
            });
            const original = Buffer.from(file.content, 'base64').toString('utf8');
            let updated = original;
            for (const [label, url] of links) {
              const pattern = new RegExp(`^\\[${label}\\]\\([^\\r\\n)]+\\)$`, 'gm');
              if ([...updated.matchAll(pattern)].length !== 1) throw new Error(`Expected one README link: ${label}`);
              updated = updated.replace(pattern, () => `[${label}](${url})`);
            }
            if (updated === original) {
              core.info(`README links already match ${release.tag_name}.`);
              return;
            }
            const identity = { name: 'SunSinD', email: '168051761+SunSinD@users.noreply.github.com' };
            await github.rest.repos.createOrUpdateFileContents({
              ...repo, branch, path: 'README.md', sha: file.sha,
              message: `docs: update downloads for ${release.tag_name}`,
              content: Buffer.from(updated).toString('base64'),
              author: identity, committer: identity
            });
